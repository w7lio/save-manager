<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1226;--panel:#271a38;--deep:#150d1f;--ink:#f1e8d0;--dim:#9b8cb5;--line:#0e0816;--cy:#4fe3d0;--pk:#ff5c8a;--yl:#ffd23f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:22px/1.2 'VT323',ui-monospace,Consolas,monospace;padding:20px 14px 60px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font:20px 'Press Start 2P',ui-monospace,monospace;margin:0;color:var(--yl);text-shadow:3px 3px 0 var(--line)}
h2{font:12px 'Press Start 2P',ui-monospace,monospace;margin:0 0 14px;color:var(--cy)}
nav button{background:none;box-shadow:none;color:var(--dim);margin:0 4px 0 0;padding:4px 10px}
nav button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--yl)}
.box{background:var(--panel);box-shadow:0 0 0 3px var(--line),6px 6px 0 3px var(--line);padding:18px;display:grid;grid-template-columns:200px 1fr;gap:22px}
button,.btn,input,textarea{font:inherit;color:inherit}
button{background:var(--ink);color:var(--line);border:0;padding:5px 14px;cursor:pointer;box-shadow:0 3px 0 #8c7f63;margin:0 6px 6px 0}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(3px);box-shadow:none}
button.cy{background:var(--cy);box-shadow:0 3px 0 #23897d}
button.pk{background:var(--pk);box-shadow:0 3px 0 #a02a53}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--dim)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px dashed var(--yl);outline-offset:2px}
input[type=search],input[type=text],textarea{background:var(--deep);border:0;box-shadow:inset 0 0 0 2px #3d2c55;padding:7px 10px;width:100%}
textarea{height:220px;resize:vertical;font-size:19px;line-height:1.15;word-break:break-all}
#groups button{display:block;width:100%;text-align:left;background:transparent;color:var(--dim);box-shadow:none;padding:5px 8px;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#groups button.on{color:var(--ink);background:var(--deep);box-shadow:inset 4px 0 0 var(--cy)}
#groups i{font-style:normal;float:right;margin-left:8px;color:var(--cy)}
.acts{margin:12px 0 2px}
.meta{display:flex;align-items:center;gap:10px;color:var(--dim);padding:6px 8px;font-size:19px}
.list{background:var(--deep);max-height:440px;overflow:auto}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;cursor:pointer;border-top:2px solid var(--panel)}
.row:hover{background:#1f1530}
.nm{min-width:0}
.nm b{font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--dim);font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz{color:var(--cy);font-size:19px}
input[type=checkbox]{appearance:none;width:18px;height:18px;background:var(--deep);box-shadow:0 0 0 2px var(--dim);margin:0 2px;cursor:pointer}
input[type=checkbox]:checked{background:var(--cy);box-shadow:0 0 0 2px var(--cy),inset 0 0 0 4px var(--deep)}
.empty{padding:28px;text-align:center;color:var(--dim)}
dialog{background:var(--panel);color:var(--ink);border:0;padding:18px;width:min(640px,94vw);box-shadow:0 0 0 3px var(--line),8px 8px 0 3px var(--line)}
dialog::backdrop{background:rgba(10,4,20,.82)}
.note{color:var(--dim);margin:0 0 8px;font-size:19px}
.pv{max-height:200px;overflow:auto;background:var(--deep);margin-top:10px}
.pv div{padding:5px 8px;display:flex;justify-content:space-between;gap:10px}
.pv em{font-style:normal;color:var(--yl)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--yl);color:var(--line);padding:6px 16px;display:none;z-index:9;box-shadow:0 3px 0 #a98a0f}
[hidden]{display:none!important}
.one{display:block}
@media(max-width:640px){.box{grid-template-columns:1fr}#groups{display:flex;flex-wrap:wrap}#groups button{width:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SAVE VAULT</h1>
    <nav><button id="t-ls" class="on">localStorage</button><button id="t-idb">IndexedDB</button></nav>
  </header>

  <div class="box" id="p-ls">
    <aside><h2>GAME</h2><div id="groups"></div></aside>
    <section>
      <input type="search" id="q" placeholder="Tìm key hoặc tên game" aria-label="Tìm">
      <div class="acts">
        <button class="cy" id="share">Tạo code</button>
        <button id="paste">Dán code</button>
        <button class="ghost" id="new">+ Key</button>
        <button class="pk" id="del" hidden>Xoá</button>
      </div>
      <div class="meta"><input type="checkbox" id="all" aria-label="Chọn tất cả"><span id="info"></span></div>
      <div class="list" id="list"></div>
    </section>
  </div>

  <div class="box one" id="p-idb" hidden>
    <h2>INDEXEDDB</h2>
    <p class="note">Chỉ liệt kê và xoá database. Game dùng IndexedDB cần sao lưu bằng chức năng của chính game đó.</p>
    <div class="list" id="idblist"></div>
  </div>
</div>

<dialog id="dlg">
  <h2 id="dtitle">SỬA KEY</h2>
  <p class="note">Key</p>
  <input type="text" id="dkey" spellcheck="false">
  <p class="note" style="margin-top:12px">Giá trị</p>
  <textarea id="dval" spellcheck="false"></textarea>
  <div style="margin-top:12px">
    <button class="cy" id="dsave">Lưu</button>
    <button class="ghost" id="dfmt">Format JSON</button>
    <button class="pk" id="ddel">Xoá</button>
    <button class="ghost" id="dclose">Đóng</button>
  </div>
</dialog>

<dialog id="sdlg">
  <h2>CODE CỦA BẠN</h2>
  <p class="note" id="sinfo"></p>
  <textarea id="scode" readonly></textarea>
  <div style="margin-top:12px">
    <button class="cy" id="scopy">Copy code</button>
    <button class="ghost" id="sclose">Đóng</button>
  </div>
</dialog>

<dialog id="pdlg">
  <h2>DÁN CODE</h2>
  <textarea id="pcode" placeholder="Dán code bắt đầu bằng SV1. vào đây" spellcheck="false"></textarea>
  <div class="pv" id="pv" hidden></div>
  <div style="margin-top:12px">
    <button id="pview">Xem trước</button>
    <button class="cy" id="pgo" hidden>Nhập</button>
    <button class="ghost" id="pclose">Đóng</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var sel=new Set(),group='all',editing=null,editLz=false,cache={},parsed=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}

/* ---- đọc dữ liệu RPG Maker (MV nén LZString) ---- */
function dec(k,v){
  if(!/RPG (File\d+|Global|Config|Common)$/.test(k))return {text:v,lz:false};
  var c=cache[k];if(c&&c.v===v)return c.d;
  var d={text:v,lz:false};
  try{if(window.LZString){var s=LZString.decompressFromBase64(v);if(s)d={text:s,lz:true}}}catch(e){}
  cache[k]={v:v,d:d};return d;
}
function gname(k){var m=k.match(/^([^_:\-.\/ ]+)[_:\-.\/ ]/);return m?m[1]:'(khác)'}
function items(){
  var a=[],gi={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),v=localStorage.getItem(k),d=dec(k,v);
    a.push({k:k,v:v,txt:d.text,size:(k.length+v.length)*2,g:gname(k)});
    if(/RPG Global$/.test(k)){try{var j=JSON.parse(d.text);if(Array.isArray(j))gi[k.replace(/RPG Global$/,'')]=j}catch(e){}}
  }}catch(e){toast('Không đọc được localStorage')}
  a.forEach(function(o){
    var m=o.k.match(/^(.*)RPG File(\d+)$/);
    if(m){var inf=gi[m[1]]&&gi[m[1]][+m[2]];if(inf&&inf.title){o.title=inf.title;o.info=inf;o.g=inf.title}else o.g='RPG Maker (không rõ game)'}
    else if(/RPG \w+$/.test(o.k))o.g='RPG Maker (chung)';
  });
  return a.sort(function(x,y){return x.k.localeCompare(y.k,undefined,{numeric:true})});
}

/* ---- giao diện danh sách ---- */
var shown=[];
function render(){
  var all=items(),q=$('#q').value.toLowerCase(),gs={};
  all.forEach(function(o){gs[o.g]=(gs[o.g]||0)+1});
  if(group!=='all'&&!gs[group])group='all';
  var gh='<button data-g="all" class="'+(group==='all'?'on':'')+'">Tất cả<i>'+all.length+'</i></button>';
  Object.keys(gs).sort().forEach(function(g){gh+='<button title="'+esc(g)+'" data-g="'+esc(g)+'" class="'+(group===g?'on':'')+'">'+esc(g)+'<i>'+gs[g]+'</i></button>'});
  $('#groups').innerHTML=gh;
  var rows=all.filter(function(o){return (group==='all'||o.g===group)&&(!q||o.k.toLowerCase().indexOf(q)>-1||(o.title||'').toLowerCase().indexOf(q)>-1||o.txt.toLowerCase().indexOf(q)>-1)});
  shown=rows.map(function(o){return o.k});
  $('#list').innerHTML=rows.length?rows.map(function(o){
    return '<div class="row" tabindex="0" data-k="'+esc(o.k)+'"><input type="checkbox" aria-label="Chọn" '+(sel.has(o.k)?'checked':'')+'><div class="nm"><b>'+esc(o.k)+'</b><small>'+esc(o.title||o.txt.slice(0,70))+'</small></div><span class="sz">'+fmt(o.size)+'</span></div>';
  }).join(''):'<div class="empty">Chưa có key nào. Chơi game rồi quay lại, hoặc dán code save.</div>';
  var total=all.reduce(function(s,o){return s+o.size},0);
  $('#info').textContent=(sel.size?sel.size+' đã chọn  |  ':'')+rows.length+' key  |  tổng '+fmt(total)+' / ~5 MB';
  $('#all').checked=rows.length>0&&shown.every(function(k){return sel.has(k)});
  $('#del').hidden=!sel.size;$('#del').textContent='Xoá '+sel.size;
}
$('#groups').onclick=function(e){var b=e.target.closest('button');if(b){group=b.dataset.g;render()}};
$('#q').oninput=render;
$('#list').onclick=function(e){
  var r=e.target.closest('.row');if(!r)return;
  var k=r.dataset.k;
  if(e.target.type==='checkbox'){e.target.checked?sel.add(k):sel.delete(k);render();return}
  openEd(k);
};
$('#list').onkeydown=function(e){if(e.key==='Enter'&&e.target.classList.contains('row'))openEd(e.target.dataset.k)};
$('#all').onchange=function(e){shown.forEach(function(k){e.target.checked?sel.add(k):sel.delete(k)});render()};
$('#del').onclick=function(){
  var ks=Array.from(sel).filter(function(k){return localStorage.getItem(k)!==null});
  if(!ks.length)return;
  if(!confirm('Xoá '+ks.length+' key? Không hoàn tác được.'))return;
  ks.forEach(function(k){localStorage.removeItem(k)});sel.clear();render();toast('Đã xoá '+ks.length+' key');
};

/* ---- sửa key ---- */
var dlg=$('#dlg');
function openEd(k){
  editing=k;
  $('#dtitle').textContent=k===null?'KEY MỚI':'SỬA KEY';
  $('#dkey').value=k===null?'':k;
  var raw=k===null?'':localStorage.getItem(k),d=dec(k||'',raw);editLz=d.lz;
  $('#dval').value=d.text;
  $('#ddel').hidden=k===null;
  dlg.showModal();
}
$('#new').onclick=function(){openEd(null)};
$('#dclose').onclick=function(){dlg.close()};
$('#dfmt').onclick=function(){try{$('#dval').value=JSON.stringify(JSON.parse($('#dval').value),null,2)}catch(e){toast('Không phải JSON hợp lệ')}};
$('#dsave').onclick=function(){
  var k=$('#dkey').value;if(!k)return toast('Cần nhập key');
  try{
    var val=$('#dval').value;if(editLz&&window.LZString)val=LZString.compressToBase64(val);
    if(editing!==null&&editing!==k)localStorage.removeItem(editing);
    localStorage.setItem(k,val);
  }catch(e){return toast('Lưu thất bại (đầy bộ nhớ?)')}
  dlg.close();render();toast('Đã lưu');
};
$('#ddel').onclick=function(){
  if(!confirm('Xoá key "'+editing+'"?'))return;
  localStorage.removeItem(editing);sel.delete(editing);dlg.close();render();toast('Đã xoá');
};

/* ---- share code ---- */
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
$('#share').onclick=function(){
  if(!window.LZString)return toast('Chưa tải được thư viện nén, kiểm tra mạng');
  var all=items(),pick=sel.size?all.filter(function(o){return sel.has(o.k)}):all.filter(function(o){return group==='all'||o.g===group});
  if(!pick.length)return toast('Không có gì để chia sẻ');
  var d={},g={};pick.forEach(function(o){d[o.k]=o.v;if(o.info)g[o.k]=o.info});
  var p=LZString.compressToEncodedURIComponent(JSON.stringify({d:d,g:g})),code='SV1.'+hash(p)+'.'+p;
  $('#scode').value=code;
  $('#sinfo').textContent=pick.length+' key, code dài '+code.length.toLocaleString('vi')+' ký tự'+(code.length>100000?'. Code rất dài, app chat có thể cắt mất. Hãy chọn ít key hơn.':'.');
  $('#sdlg').showModal();$('#scode').select();
};
$('#scopy').onclick=function(){
  var t=$('#scode');t.select();
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(function(){toast('Đã copy')},function(){document.execCommand('copy');toast('Đã copy')});
};
$('#sclose').onclick=function(){$('#sdlg').close()};

/* ---- paste code ---- */
function parseCode(t){
  if(!window.LZString)throw 'Chưa tải được thư viện nén, kiểm tra mạng';
  t=t.replace(/\s+/g,'');
  var m=t.match(/^SV1\.([0-9a-z]+)\.(.+)$/);
  if(!m)throw 'Code không đúng định dạng';
  if(hash(m[2])!==m[1])throw 'Code bị thiếu hoặc sai ký tự, có thể đã bị cắt khi dán';
  var j=JSON.parse(LZString.decompressFromEncodedURIComponent(m[2]));
  if(!j||!j.d)throw 'Không đọc được nội dung code';
  return j;
}
$('#paste').onclick=function(){$('#pcode').value='';$('#pv').hidden=true;$('#pgo').hidden=true;parsed=null;$('#pdlg').showModal()};
$('#pclose').onclick=function(){$('#pdlg').close()};
$('#pview').onclick=function(){
  try{parsed=parseCode($('#pcode').value)}catch(e){parsed=null;$('#pgo').hidden=true;return toast(typeof e==='string'?e:'Code không hợp lệ')}
  var ks=Object.keys(parsed.d);
  $('#pv').innerHTML=ks.map(function(k){
    var inf=parsed.g&&parsed.g[k],over=localStorage.getItem(k)!==null;
    return '<div><span>'+esc(k)+(inf?' - '+esc(inf.title):'')+'</span><em>'+(over?'ghi đè':'mới')+'</em></div>';
  }).join('');
  $('#pv').hidden=false;$('#pgo').hidden=false;
  $('#pgo').textContent='Nhập '+ks.length+' key';
};
$('#pgo').onclick=function(){
  if(!parsed)return;
  var j=parsed,ks=Object.keys(j.d);
  try{
    ks.forEach(function(k){localStorage.setItem(k,j.d[k])});
    Object.keys(j.g||{}).forEach(function(k){
      var m=k.match(/^(.*)RPG File(\d+)$/);if(!m)return;
      var gk=m[1]+'RPG Global',arr=[],lz=!!window.LZString,raw=localStorage.getItem(gk);
      if(raw!==null){var dd=dec(gk,raw);lz=dd.lz;try{arr=JSON.parse(dd.text)}catch(e){arr=[]}if(!Array.isArray(arr))arr=[]}
      arr[+m[2]]=j.g[k];
      var t=JSON.stringify(arr);localStorage.setItem(gk,lz?LZString.compressToBase64(t):t);
    });
  }catch(e){return toast('Nhập thất bại (đầy bộ nhớ?)')}
  $('#pdlg').close();render();toast('Đã nhập '+ks.length+' key');
};

/* ---- tab IndexedDB ---- */
function tab(t){
  $('#t-ls').classList.toggle('on',t==='ls');$('#t-idb').classList.toggle('on',t==='idb');
  $('#p-ls').hidden=t!=='ls';$('#p-idb').hidden=t!=='idb';
  if(t==='idb')loadIdb();
}
$('#t-ls').onclick=function(){tab('ls')};
$('#t-idb').onclick=function(){tab('idb')};
function loadIdb(){
  var box=$('#idblist');
  if(!indexedDB.databases){box.innerHTML='<div class="empty">Trình duyệt không hỗ trợ liệt kê IndexedDB.</div>';return}
  indexedDB.databases().then(function(l){
    box.innerHTML=l.length?l.map(function(d){
      return '<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto"><div class="nm"><b>'+esc(d.name)+'</b></div><span class="sz">v'+d.version+'</span><button class="pk" style="margin:0" data-db="'+esc(d.name)+'">Xoá</button></div>';
    }).join(''):'<div class="empty">Chưa có database nào.</div>';
  });
}
$('#idblist').onclick=function(e){
  var n=e.target.dataset&&e.target.dataset.db;if(!n)return;
  if(!confirm('Xoá database "'+n+'"? Không hoàn tác được.'))return;
  var r=indexedDB.deleteDatabase(n);
  r.onsuccess=function(){toast('Đã xoá');loadIdb()};
  r.onblocked=function(){toast('Bị chặn: hãy đóng các tab game đang mở')};
};

render();
})();
</script>
</body>
</html>
